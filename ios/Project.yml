name: CuantoSocials
options:
  bundleIdPrefix: com.cuantolabs
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Debug-Staging: debug
  Release-Staging: release
  Release: release
packages:
  CuantoKit:
    path: ../../cuanto-kit
  SocialsCore:
    path: Packages/SocialsCore
settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8AWCD3T4B5
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      BUNDLE_ID_SUFFIX: ""
      API_BASE_URL: http://localhost:3800
    Debug-Staging:
      BUNDLE_ID_SUFFIX: .staging
      API_BASE_URL: https://api-staging.socials.cuantolabs.com
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STAGING"
    Release-Staging:
      BUNDLE_ID_SUFFIX: .staging
      API_BASE_URL: https://api-staging.socials.cuantolabs.com
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STAGING"
    Release:
      BUNDLE_ID_SUFFIX: ""
      API_BASE_URL: https://api.socials.cuantolabs.com
targets:
  CuantoSocials:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Fonts
        buildPhase: resources
      - path: Sources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cuanto Socials
        # Plus Jakarta Sans (OFL, ios/Fonts/OFL.txt) — the web app's family, so both
        # platforms set type identically. See ios/brand-spec.md § Type.
        UIAppFonts:
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.cuantolabs.socials.refresh
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - cuantosocials
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        SocialsAPIBaseURL: $(API_BASE_URL)
    entitlements:
      path: App/CuantoSocials.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cuantolabs.socials
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.cuantolabs.socials.shared"
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:socials.cuantolabs.com
    dependencies:
      - package: CuantoKit
        product: CuantoCore
      - package: CuantoKit
        product: CuantoNet
      - package: CuantoKit
        product: CuantoUI
      - package: CuantoKit
        product: CuantoStore
      - package: CuantoKit
        product: CuantoNotify
      - package: CuantoKit
        product: CuantoAnalytics
      - package: SocialsCore
        product: SocialsCore
      - package: CuantoKit
        product: CuantoTesting
      # The extension targets, embedded + signed into the app bundle. These
      # MUST stay in the same `dependencies:` list as the packages above —
      # YAML keeps only the last of two identical keys, so a second
      # `dependencies:` silently drops every CuantoKit product.
      - target: CuantoSocialsShare
        embed: true
        codeSign: true
      - target: CuantoSocialsWidgets
        embed: true
        codeSign: true
      - target: CuantoSocialsIntents
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuantolabs.socials$(BUNDLE_ID_SUFFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CuantoSocials App Store"
  CuantoSocialsShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: ShareExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Core/Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Cuanto Socials Share
        SocialsAPIBaseURL: $(API_BASE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    entitlements:
      path: ShareExtension/CuantoSocialsShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cuantolabs.socials
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.cuantolabs.socials.shared"
    dependencies:
      - package: CuantoKit
        product: CuantoCore
      - package: CuantoKit
        product: CuantoUI
      - package: SocialsCore
        product: SocialsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuantolabs.socials$(BUNDLE_ID_SUFFIX).share
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CuantoSocials Share App Store"
  CuantoSocialsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Core/Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Cuanto Socials Widgets
        SocialsAPIBaseURL: $(API_BASE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/CuantoSocialsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cuantolabs.socials
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.cuantolabs.socials.shared"
    dependencies:
      - package: CuantoKit
        product: CuantoCore
      - package: CuantoKit
        product: CuantoUI
      - package: SocialsCore
        product: SocialsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuantolabs.socials$(BUNDLE_ID_SUFFIX).widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CuantoSocials Widgets App Store"
  CuantoSocialsIntents:
    # FALLBACK: xcodegen 2.46.0 ships no `extensionkit-extension` settings
    # preset, so this uses the known-good `app-extension` product type with
    # the App Intents extension point identifier instead.
    type: app-extension
    platform: iOS
    sources:
      - path: Intents
      - path: Intents/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Core/Shared
      - path: Sources/Intents
      # DraftPostIntent/SchedulePostIntent/TodayScheduleIntent also compile into the
      # container app via the `CuantoSocials` target's blanket `- path: Sources`
      # (AppShortcutsProvider needs the intent types in the same module) — see
      # Sources/Intents for the shared App Intents.
    info:
      path: Intents/Info.plist
      properties:
        CFBundleDisplayName: Cuanto Socials Intents
        SocialsAPIBaseURL: $(API_BASE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.appintents-extension
    entitlements:
      path: Intents/CuantoSocialsIntents.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cuantolabs.socials
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.cuantolabs.socials.shared"
    dependencies:
      - package: CuantoKit
        product: CuantoCore
      - package: CuantoKit
        product: CuantoNet
      - package: SocialsCore
        product: SocialsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuantolabs.socials$(BUNDLE_ID_SUFFIX).intents
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CuantoSocials Intents App Store"
  CuantoSocialsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CuantoSocials
      - package: CuantoKit
        product: CuantoTesting
      - package: SocialsCore
        product: SocialsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuantolabs.socials.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CuantoSocials.app/CuantoSocials"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  CuantoSocialsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CuantoSocials
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuantolabs.socials.uitests
        TEST_TARGET_NAME: CuantoSocials
        GENERATE_INFOPLIST_FILE: YES
        # Override the project-wide MainActor default isolation (line 21) for this target only:
        # XCTestCase's setUp()/init overrides are imported as nonisolated, and the project default
        # collides with them ("has different actor isolation from nonisolated overridden
        # declaration"). UI test code runs out-of-process from the app under test, so nothing here
        # needs MainActor isolation.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  CuantoSocials:
    build:
      parallelizeBuild: true
      targets:
        CuantoSocials: all
        CuantoSocialsShare: all
        CuantoSocialsWidgets: all
        CuantoSocialsIntents: all
        CuantoSocialsTests: [test]
        CuantoSocialsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      parallelizable: false
      targets:
        - CuantoSocialsTests
        - CuantoSocialsUITests
  CuantoSocials-Staging:
    build:
      parallelizeBuild: true
      targets:
        CuantoSocials: all
        CuantoSocialsShare: all
        CuantoSocialsWidgets: all
        CuantoSocialsIntents: all
    run:
      config: Debug-Staging
